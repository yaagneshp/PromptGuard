<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PromptGuard Monitor — Settings</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 320px; padding: 16px; }
      label { display: block; margin-top: 12px; font-size: 13px; font-weight: 600; }
      input { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
      button { margin-top: 16px; padding: 8px 12px; }
      #status { margin-top: 10px; font-size: 12px; color: #2a7; min-height: 16px; }
    </style>
  </head>
  <body>
    <h3>PromptGuard Monitor</h3>
    <label for="backendUrl">Backend URL</label>
    <input id="backendUrl" type="text" placeholder="http://127.0.0.1:8000" />

    <label for="apiKey">API Key</label>
    <input id="apiKey" type="text" placeholder="change-me-dev-key" />

    <button id="save">Save</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
